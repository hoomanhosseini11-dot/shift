<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شیفت داروخانه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f4;--cd:#fff;--tx:#18262b;--mu:#667a80;--pr:#0b6e66;--bd:#dde5e4;--ok:#157a3b;--wa:#a8590a;--er:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#101a1c;--cd:#172629;--tx:#e6eeee;--mu:#93a8ac;--pr:#2bb5a8;--bd:#2a3d41;--ok:#4cc27a;--wa:#e0933f;--er:#f27c74}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.7 Vazirmatn,Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:960px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select,button{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;max-width:100%}
button{cursor:pointer;font-weight:600}button.p{background:var(--pr);border-color:var(--pr);color:#fff}button.d{color:var(--er)}
input:focus,select:focus{outline:2px solid var(--pr);outline-offset:1px}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fm label{display:flex;flex-direction:column;gap:3px;color:var(--mu)}
.fb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dt{display:flex;gap:4px}.dt select{flex:1;padding:8px 4px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:right}th{color:var(--mu);font-weight:600}
.b{padding:1px 10px;border-radius:99px;font-size:12px;border:1px solid;font-weight:600}
.b.pending{color:var(--wa)}.b.confirmed{color:var(--ok)}.b.rejected,.b.voided{color:var(--er)}
.mu{color:var(--mu)}.pv{background:var(--bg);border-radius:8px;padding:8px 12px;margin:10px 0}
#msg{position:sticky;top:0;z-index:5}#msg div{padding:9px 12px;border-radius:8px;margin-bottom:10px;border:1px solid var(--ok);background:var(--cd);color:var(--ok)}
#msg div.e{border-color:var(--er);color:var(--er)}
.auth{max-width:420px;margin:6vh auto}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}.tabs .on{background:var(--pr);color:#fff;border-color:var(--pr)}
.code{font:700 18px/1.4 monospace;letter-spacing:2px;direction:ltr;display:inline-block;padding:4px 10px;border:1px dashed var(--pr);border-radius:8px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="w"><div id="msg"></div><div id="app"><p class="mu">در حال بارگذاری…</p></div></div>
<script>
const SB_URL='https://xzdshyqcmmponlltwsfl.supabase.co',SB_KEY='sb_publishable_gg8zDAtbJ11Rlmfbegjgyg_npa9KnH6';
const UDOM='users.shiftapp.app',CUR='ریال'; // ایمیل ساختگی برای حساب‌های «فقط نام کاربری»
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fa=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const num=v=>Math.round(Number(fa(v).replace(/[,٬\s]/g,''))||0),fmt=n=>Math.round(n).toLocaleString('en-US');
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const ST={pending:'منتظر تأیید',confirmed:'تأییدشده',rejected:'ردشده',voided:'ابطال‌شده'};
function j2g(jy,jm,jd){jy+=1595;let d=-355668+365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186),gy=400*Math.floor(d/146097);d%=146097;if(d>36524){gy+=100*Math.floor(--d/36524);d%=36524;if(d>=365)d++}gy+=4*Math.floor(d/1461);d%=1461;if(d>365){gy+=Math.floor((d-1)/365);d=(d-1)%365}let gd=d+1;const s=[0,31,((gy%4==0&&gy%100!=0)||gy%400==0)?29:28,31,30,31,30,31,31,30,31,30,31];let gm=0;for(;gm<13;gm++){if(gd<=s[gm])break;gd-=s[gm]}return[gy,gm,gd]}
const tj=()=>{const p=new Intl.DateTimeFormat('en-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date()),g=t=>+p.find(x=>x.type==t).value;return[g('year'),g('month'),g('day')]};
const opt=(a,v)=>a.map(o=>`<option value="${o[0]}" ${String(o[0])==String(v)?'selected':''}>${esc(o[1])}</option>`).join('');
function msg(t,err){$('#msg').innerHTML=`<div class="${err?'e':''}">${esc(t)}</div>`;clearTimeout(msg.t);msg.t=setTimeout(()=>$('#msg').innerHTML='',6000)}
const fail=e=>msg((e&&e.message)||'خطا در ارتباط با سرور',1);

let S={me:null,ms:[],cur:null,shifts:[],tab:'login'};

// ---------- ورود و ثبت‌نام ----------
const toEmail=v=>{v=fa(v).trim().toLowerCase();return v.includes('@')?v:v+'@'+UDOM};
function authView(){const su=S.tab=='signup';
 $('#app').innerHTML=`<div class="card auth"><h1>💊 شیفت داروخانه</h1><p class="mu">ثبت شیفت و تسویه با داروخانه</p>
 <div class="tabs"><button class="${su?'':'on'}" onclick="S.tab='login';authView()">ورود</button><button class="${su?'on':''}" onclick="S.tab='signup';authView()">ثبت‌نام</button></div>
 <div class="fm" style="grid-template-columns:1fr">
 ${su?`<label>نام و نام خانوادگی<input id="a_n"></label><label>نوع حساب<select id="a_r"><option value="pharmacist">داروساز</option><option value="owner">صاحب داروخانه</option></select></label>`:''}
 <label>ایمیل یا نام کاربری<input id="a_u" dir="ltr" autocapitalize="none" autocomplete="username"></label>
 <label>رمز عبور<input id="a_p" type="password" dir="ltr" autocomplete="${su?'new-password':'current-password'}" onkeydown="if(event.key=='Enter')${su?'doSignup()':'doLogin()'}"></label></div>
 ${su?'<p class="mu">نام کاربری فقط حروف کوچک انگلیسی، عدد و _ (حداقل ۳ حرف). حساب بدون ایمیل بازیابی رمز ندارد.</p>':''}
 <p><button class="p" onclick="${su?'doSignup()':'doLogin()'}">${su?'ساخت حساب':'ورود'}</button></p></div>`}
async function doLogin(){const{error}=await sb.auth.signInWithPassword({email:toEmail($('#a_u').value),password:$('#a_p').value});if(error)msg('ایمیل/نام کاربری یا رمز اشتباه است',1)}
async function doSignup(){const raw=fa($('#a_u').value).trim().toLowerCase(),name=$('#a_n').value.trim(),pw=$('#a_p').value,isE=raw.includes('@');
 if(!name)return msg('نام را وارد کنید',1);if(pw.length<6)return msg('رمز حداقل ۶ کاراکتر باشد',1);
 if(!isE&&!/^[a-z0-9_]{3,30}$/.test(raw))return msg('نام کاربری معتبر نیست',1);
 const{error}=await sb.auth.signUp({email:toEmail(raw),password:pw,options:{data:{full_name:name,role:$('#a_r').value,username:isE?'':raw}}});
 if(error)msg(/already|registered/i.test(error.message)?'این ایمیل یا نام کاربری قبلاً ثبت شده':error.message,1)}
const logout=()=>sb.auth.signOut();

// ---------- بارگذاری داده ----------
async function boot(user){
 const p=await sb.from('profiles').select('*').eq('id',user.id).single();if(p.error)return fail(p.error);S.me=p.data;
 await loadMs();home()}
async function loadMs(){
 const r=await sb.from('memberships').select('id,role,ended_at,pharmacy_id,pharmacies(id,name,owner_id)').order('started_at');
 if(r.error)return fail(r.error);S.ms=r.data.filter(m=>m.pharmacies);
 const act=S.ms.filter(m=>!m.ended_at);if(!S.ms.some(m=>m.pharmacy_id==S.cur))S.cur=(act[0]||S.ms[0])?.pharmacy_id||null;
 await loadShifts()}
async function loadShifts(){S.shifts=[];if(!S.cur)return;
 const r=await sb.from('shifts').select('*').eq('pharmacy_id',S.cur).order('shift_gdate',{ascending:false}).order('start_time',{ascending:false});
 if(r.error)return fail(r.error);S.shifts=r.data}
const curM=()=>S.ms.find(m=>m.pharmacy_id==S.cur),curP=()=>curM()?.pharmacies;

// ---------- صفحهٔ اصلی ----------
function home(){const me=S.me,m=curM(),ph=curP(),isPh=me.role=='pharmacist',live=m&&!m.ended_at;
 $('#app').innerHTML=`<div class="top"><div><h1>💊 شیفت داروخانه</h1><span class="mu">${esc(me.full_name)} — ${isPh?'داروساز':'صاحب داروخانه'}${me.is_admin?' — ادمین':''}</span></div><button onclick="logout()">خروج</button></div>
 <div class="card"><h2>داروخانه</h2>
 ${S.ms.length?`<div class="fb"><select onchange="S.cur=this.value;loadShifts().then(home)">${S.ms.map(x=>`<option value="${x.pharmacy_id}" ${x.pharmacy_id==S.cur?'selected':''}>${esc(x.pharmacies.name)}${x.ended_at?' (پایان‌یافته)':''}</option>`).join('')}</select>
 <span class="mu">${ph?(ph.owner_id?'دارای صاحب؛ شیفت‌ها نیاز به تأیید دارند':'شخصی؛ شیفت‌ها مستقیم تأییدشده ثبت می‌شوند'):''}</span></div>`:'<p class="mu">هنوز داروخانه‌ای ندارید. یکی بسازید یا با کد دعوت وصل شوید.</p>'}
 <div class="fb" style="margin-top:10px"><input id="np" placeholder="نام داروخانهٔ جدید"><button class="p" onclick="newPh()">ساخت داروخانه</button></div>
 <div class="fb" style="margin-top:8px"><input id="ic" dir="ltr" placeholder="کد دعوت" autocapitalize="characters"><button onclick="joinPh()">پیوستن با کد</button></div>
 ${live?`<div class="fb" style="margin-top:8px"><select id="ir">${isPh?'<option value="owner">دعوت صاحب داروخانه</option><option value="pharmacist">دعوت داروساز</option>':'<option value="pharmacist">دعوت داروساز</option>'}</select><button onclick="mkInv()">ساخت کد دعوت</button><span id="invo"></span></div>`:''}</div>
 ${live&&isPh?shiftForm():''}${ph?shiftList():''}`;
 if(live&&isPh)prev()}

async function newPh(){const n=$('#np').value.trim();if(!n)return msg('نام داروخانه را بنویسید',1);
 const r=await sb.rpc('create_pharmacy',{p_name:n});if(r.error)return fail(r.error);S.cur=r.data;await loadMs();home();msg('داروخانه ساخته شد')}
async function joinPh(){const c=$('#ic').value.trim();if(!c)return msg('کد را وارد کنید',1);
 const r=await sb.rpc('accept_invite',{p_code:c});if(r.error)return fail(r.error);S.cur=r.data;await loadMs();home();msg('به داروخانه پیوستید')}
async function mkInv(){const r=await sb.rpc('create_invite',{p_pharmacy:S.cur,p_role:$('#ir').value});if(r.error)return fail(r.error);
 $('#invo').innerHTML=`<span class="code">${esc(r.data)}</span> <span class="mu">۷ روز اعتبار، یک‌بار مصرف</span>`}

// ---------- ثبت شیفت ----------
function shiftForm(){const[y,mo,d]=tj(),ys=[];for(let i=1403;i<=1412;i++)ys.push([i,i]);
 return `<div class="card"><h2>ثبت شیفت</h2><div class="fm">
 <label>تاریخ شمسی<div class="dt" id="f_d"><select>${opt(ys,y)}</select><select>${opt(MN.map((n,i)=>[i+1,n]),mo)}</select><select>${opt([...Array(31)].map((_,i)=>[i+1,i+1]),d)}</select></div></label>
 <label>ساعت شروع<input type="time" id="f_s" value="16:00" oninput="prev()"></label>
 <label>ساعت پایان<input type="time" id="f_e" value="00:00" oninput="prev()"></label>
 <label>مبلغ (${CUR})<div class="dt"><select id="f_m" onchange="prev()" style="flex:0 0 42%"><option value="total">مبلغ کل شیفت</option><option value="hourly">نرخ هر ساعت</option></select><input id="f_r" inputmode="numeric" oninput="this.value=this.value?fmt(num(this.value)):'';prev()" style="flex:1;min-width:0"></div></label>
 <label>جایگزین (فقط اگر خودتان نرفتید)<input id="f_o" placeholder="نام فردی که به‌جای شما رفته"></label>
 <label>توضیحات<input id="f_n"></label></div>
 <div class="pv" id="pv"></div><button class="p" onclick="saveShift()">ذخیره شیفت</button></div>`}
const hrs=(s,e)=>{if(!s||!e)return 0;const[a,b]=s.split(':').map(Number),[c,d]=e.split(':').map(Number);let x=a*60+b,y=c*60+d;if(y<=x)y+=1440;return Math.round((y-x)/60*100)/100};
function prev(){const h=hrs($('#f_s').value,$('#f_e').value),r=num($('#f_r').value),t=$('#f_m').value=='total';
 $('#pv').innerHTML=`مدت: <b>${h}</b> ساعت — مبلغ شیفت: <b>${fmt(t?r:h*r)} ${CUR}</b>`}
async function saveShift(){const s=document.querySelectorAll('#f_d select'),jy=+s[0].value,jm=+s[1].value,jd=+s[2].value,v=num($('#f_r').value);
 if(!v)return msg('مبلغ را وارد کنید',1);if(!$('#f_s').value||!$('#f_e').value)return msg('ساعت‌ها را وارد کنید',1);
 const[gy,gm,gd]=j2g(jy,jm,jd);
 const r=await sb.rpc('save_shift',{p_id:null,p_pharmacy:S.cur,p_date:`${jy}/${pad(jm)}/${pad(jd)}`,p_gdate:`${gy}-${pad(gm)}-${pad(gd)}`,p_start:$('#f_s').value,p_end:$('#f_e').value,p_mode:$('#f_m').value,p_value:v,p_substitute:$('#f_o').value,p_note:$('#f_n').value});
 if(r.error)return fail(r.error);await loadShifts();home();msg(curP().owner_id?'شیفت ثبت شد و منتظر تأیید صاحب داروخانه است':'شیفت ثبت شد')}

// ---------- لیست شیفت‌ها ----------
function shiftList(){const me=S.me.id,t=S.shifts.filter(s=>s.status!='voided'&&s.status!='rejected').reduce((a,s)=>a+s.amount,0);
 return `<div class="card tw"><h2>شیفت‌ها <span class="mu" style="font-weight:400">(جمع شیفت‌های فعال: ${fmt(t)} ${CUR})</span></h2>
 <table><tr><th>تاریخ</th><th>ساعت</th><th>مدت</th><th>مبلغ</th><th>داروساز</th><th>جایگزین</th><th>وضعیت</th><th></th></tr>
 ${S.shifts.map(s=>`<tr><td>${s.shift_date}</td><td>${s.start_time}–${s.end_time}</td><td>${s.hours}</td><td>${fmt(s.amount)}</td><td>${esc(s.pharmacist_name)}</td><td>${esc(s.substitute_name||'—')}</td>
 <td><span class="b ${s.status}">${ST[s.status]}</span>${s.reject_reason?`<div class="mu">${esc(s.reject_reason)}</div>`:''}${s.void_reason?`<div class="mu">${esc(s.void_reason)}</div>`:''}</td>
 <td>${s.status!='voided'&&s.pharmacist_id==me?`<button class="d" onclick="voidS('${s.id}')">ابطال</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8" class="mu">هنوز شیفتی ثبت نشده است.</td></tr>'}</table></div>`}
async function voidS(id){const r=prompt('دلیل ابطال شیفت را بنویسید:');if(!r||!r.trim())return;
 const x=await sb.rpc('void_shift',{p_id:id,p_reason:r});if(x.error)return fail(x.error);await loadShifts();home();msg('شیفت ابطال شد')}

// ---------- شروع ----------
sb.auth.onAuthStateChange((ev,ses)=>{
 if(ses&&ses.user){if(!S.me||S.me.id!==ses.user.id)setTimeout(()=>boot(ses.user),0)}
 else{S={me:null,ms:[],cur:null,shifts:[],tab:'login'};authView()}});
</script>
</body>
</html>
