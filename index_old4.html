 $('#adm').innerHTML=r.data.map(p=>`<h3 style="margin:12px 0 4px">${esc(p.name)} <span class="mu" style="font-weight:400">— موسس: ${esc(p.owner||'ندارد')}</span></h3><table>${p.members.map(m=>`<tr><td>${esc(m.name)}</td><td>${m.role=='owner'?'موسس':'داروساز'}</td><td>${m.ended?'پایان‌یافته':'فعال'}</td><td>${m.role=='pharmacist'&&!m.ended?`<button class="d" onclick="admEnd('${m.id}')">پایان اجباری</button>`:''}</td></tr>`).join('')}</table>`).join('')||'<p class="mu">داروخانه‌ای نیست.</p>'}
async function admEnd(id){if(!confirm('همکاری بدون بررسی تسویه پایان داده شود؟'))return;
 const r=await sb.rpc('end_cooperation',{p_membership:id,p_force:true});if(r.error)return fail(r.error);await loadMs();home();msg('همکاری پایان یافت');admLoad()}

sb.auth.onAuthStateChange((ev,ses)=>{
 if(ev=='PASSWORD_RECOVERY'||(REC&&ses&&ses.user)){REC=true;setTimeout(recView,0)}
 else if(ses&&ses.user){if(!S.me||S.me.id!==ses.user.id)setTimeout(()=>boot(ses.user),0)}
 else{S={me:null,ms:[],cur:null,shifts:[],pay:[],bal:{},sub:[],ent:[],tab:'login'};authView()}});

// ---------- بازخورد فوری برای همهٔ دکمه‌ها: «صبر کنید…» تا پایان کار ----------
document.addEventListener('click',e=>{
 const b=e.target.closest&&e.target.closest('button[onclick]');
 if(!b||b.dataset.nobusy)return;
 const code=b.getAttribute('onclick');
 if(/\bthis\b|\bevent\b/.test(code))return;
 e.stopPropagation();e.preventDefault();
 if(b.disabled||b.classList.contains('busy'))return;
 let r;
 try{r=(0,eval)(code)}catch(err){console.error(err);return}
 if(r&&typeof r.then==='function'){
  const html=b.innerHTML;b.disabled=true;b.classList.add('busy');b.textContent='صبر کنید…';
  const done=()=>{if(b.isConnected){b.disabled=false;b.classList.remove('busy');b.innerHTML=html}};
  r.then(done,err=>{console.error(err);done()});
 }
},true);
</script>
