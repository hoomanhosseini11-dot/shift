 <div class="pv" id="pv"></div><button class="p" onclick="saveShift()">ذخیره شیفت</button></div>`}

function prev(){const h=hrs($('#f_s').value,$('#f_e').value),r=nI($('#f_r').value),t=$('#f_m').value=='total';
 $('#pv').innerHTML=`مدت: <b>${h}</b> ساعت — مبلغ شیفت: <b>${fmt(t?r:h*r)} ${RL()}</b>`}
let SVBUSY=false;

 if(!v)return msg('مبلغ را وارد کنید',1);if(!$('#f_s').value||!$('#f_e').value)return msg('ساعت‌ها را وارد کنید',1);
 const[gy,gm,gd]=j2g(jy,jm,jd);
 if(SVBUSY)return;
 const ds=`${jy}/${pad(jm)}/${pad(jd)}`;
 if(S.shifts.some(x=>x.shift_date==ds&&x.start_time==$('#f_s').value&&x.pharmacist_id==S.me.id&&x.status!='voided'&&x.status!='rejected'))return msg('این شیفت (همین تاریخ و ساعت شروع) قبلاً ثبت شده است',1);
 SVBUSY=true;
 const r=await sb.rpc('save_shift',{p_id:null,p_pharmacy:S.cur,p_date:`${jy}/${pad(jm)}/${pad(jd)}`,p_gdate:`${gy}-${pad(gm)}-${pad(gd)}`,p_start:$('#f_s').value,p_end:$('#f_e').value,p_mode:$('#f_m').value,p_value:v,p_substitute:$('#f_o').value,p_note:$('#f_n').value});
 SVBUSY=false;if(r.error)return fail(r.error);await loadShifts();home();msg(curP().owner_id?'شیفت ثبت شد و منتظر تأیید موسس است':'شیفت ثبت شد')}

  let m=d.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m)o.j=[+m[1],+m[2],+m[3]];else{m=d.match(new RegExp('(\\d{1,2})\\s*('+MN.join('|')+')\\s*(\\d{4})'));if(m)o.j=[+m[3],MN.indexOf(m[2])+1,+m[1]]}
  m=z.match(/(\d{1,2})(?::(\d{2}))?\s*(?:تا|الی|-|–|to)\s*(\d{1,2})(?::(\d{2}))?/);
  if(m){o.s=pad(m[1]%24)+':'+(m[2]||'00');o.e=pad(m[3]%24)+':'+(m[4]||'00')}
  o.v=Math.round(num(r.replace(/[^\d,٬]/g,''))*(/ریال/.test(r)?1:10)*k);o.sub=/^(-|—|ندارد|خودم|خودش)?$/.test(c)?'':c;
  if(!o.j)o.err='تاریخ نامعتبر';else if(!o.s)o.err='ساعت نامعتبر';else if(!o.v)o.err='نرخ نامعتبر';
  if(!o.err){o.h=hrs(o.s,o.e);o.ds=`${o.j[0]}/${pad(o.j[1])}/${pad(o.j[2])}`;
   o.dup=S.shifts.some(x=>x.shift_date==o.ds&&x.start_time==o.s&&x.pharmacist_id==S.me.id&&x.status!='voided'&&x.status!='rejected')}
  return o}).filter(o=>o.j||o.s||o.v);
 const n=IM.filter(o=>!o.err&&!o.dup).length;
 $('#i_p').innerHTML=IM.length?`<div class="tw" style="margin-top:10px"><table><tr><th></th><th>تاریخ</th><th>ساعت</th><th>مدت</th><th>نرخ ساعتی (${RL()})</th><th>مبلغ شیفت</th><th>جایگزین</th><th></th></tr>
 ${IM.map((o,i)=>o.err?`<tr><td></td><td colspan="6" class="mu">ردیف ${i+1}</td><td style="color:var(--er)">${o.err}</td></tr>`
 :`<tr><td><input type="checkbox" class="ick" value="${i}" ${o.dup?'':'checked'}></td><td>${o.ds}</td><td>${o.s}–${o.e}</td><td>${o.h}</td><td>${fmt(o.v)}</td><td>${fmt(o.v*o.h)}</td><td>${esc(o.sub||'—')}</td><td style="color:var(--wa)">${o.dup?'تکراری':''}</td></tr>`).join('')}</table></div>
 <p><button class="p" onclick="impSave()">ثبت شیفت‌های انتخاب‌شده</button> <span class="mu">${n} مورد آمادهٔ ثبت</span></p>`:'<p class="mu">شیفتی در متن پیدا نشد. هر شیفت باید خطی با «تاریخ: …» داشته باشد.</p>'}
let IMBUSY=false;
async function impSave(){if(IMBUSY)return;IMBUSY=true;const btn=document.querySelector('button[onclick="impSave()"]');if(btn){btn.disabled=true;btn.textContent='در حال ثبت… لطفاً صبر کنید'}
 let ok=0,bad=0,skip=0,last='';
 try{await loadShifts()}catch(e){}
 for(const i of [...document.querySelectorAll('.ick:checked')].map(x=>+x.value)){const o=IM[i],[gy,gm,gd]=j2g(...o.j);
  if(S.shifts.some(x=>x.shift_date==o.ds&&x.start_time==o.s&&x.pharmacist_id==S.me.id&&x.status!='voided'&&x.status!='rejected')){skip++;continue}
  const r=await sb.rpc('save_shift',{p_id:null,p_pharmacy:S.cur,p_date:o.ds,p_gdate:`${gy}-${pad(gm)}-${pad(gd)}`,p_start:o.s,p_end:o.e,p_mode:'hourly',p_value:o.v,p_substitute:o.sub,p_note:''});
  if(r.error){bad++;last=r.error.message}else{ok++;S.shifts.push({shift_date:o.ds,start_time:o.s,pharmacist_id:S.me.id,status:'pending'})}}
 IMBUSY=false;
 await loadShifts();IM=[];home();msg(`${ok} شیفت ثبت شد`+(skip?`، ${skip} مورد تکراری ردشد`:'')+(bad?`، ${bad} مورد خطا داد: ${last}`:''),bad&&!ok)}

// ================= بخش ۴ =================
let MB=[];
async function loadMb(){MB=[];if(!S.cur)return;
 const r=await sb.from('memberships').select('id,user_id,role,started_at,ended_at,history_visible_from').eq('pharmacy_id',S.cur).order('started_at');
 if(r.error)return fail(r.error);const ids=[...new Set(r.data.map(x=>x.user_id))],nmap={};
 const p=await sb.from('profiles').select('id,full_name').in('id',ids);(p.data||[]).forEach(x=>nmap[x.id]=x.full_name);
 MB=r.data.map(x=>({...x,name:nmap[x.user_id]||'—'}))}
const fd=d=>d?new Date(d).toLocaleDateString('fa-IR'):'—';
function coopCard(){const me=S.me,ph=curP(),adm=me.is_admin,mine=ph.owner_id==me.id,RL={owner:'موسس',pharmacist:'داروساز'},
 own=MB.find(x=>x.role=='owner'&&!x.ended_at),share=own&&MB.some(x=>x.user_id==me.id&&x.role=='pharmacist'&&!x.ended_at)&&MB.filter(x=>x.role=='pharmacist'&&!x.ended_at).length==1;
 return `<div class="card tw np"><h2>${ph.owner_id?'همکاری‌ها':'داروخانهٔ شخصی'}</h2><table><tr><th>نام</th><th>نقش</th><th>شروع</th><th>وضعیت</th><th></th></tr>
 ${MB.map(x=>`<tr><td>${esc(x.name)}</td><td>${RL[x.role]||x.role}</td><td>${fd(x.started_at)}</td><td>${x.ended_at?(ph.owner_id?'پایان‌یافته ':'بایگانی‌شده ')+fd(x.ended_at):'فعال'}</td>
 <td>${x.role=='pharmacist'&&!x.ended_at&&(x.user_id==me.id||mine||adm)?`<button class="d" onclick="endCo('${x.id}',false)">${ph.owner_id?'پایان همکاری':'بایگانی داروخانه'}</button>${adm?` <button class="d" onclick="endCo('${x.id}',true)">پایان اجباری (ادمین)</button>`:''}`:''}</td></tr>`).join('')}</table>
 ${share?`<div class="pv"><b>اشتراک تاریخچه با موسس</b><p class="mu" style="margin:4px 0">موسس فعلاً شیفت‌های بعد از ${fd(own.history_visible_from)} را می‌بیند. می‌توانید تاریخچهٔ قبل‌تر را هم نشان دهید.</p><div class="fb">${dsel('h_d')}<button onclick="shareH()">نمایش از این تاریخ</button></div></div>`:''}</div>`}
async function endCo(id,force){const pers=!curP().owner_id;if(!confirm(force?'همکاری بدون بررسی تسویه پایان داده شود؟':pers?'داروخانهٔ شخصی بایگانی شود؟ دیگر نمی‌توانید شیفت جدید ثبت کنید و این کار برگشت ندارد؛ ولی همهٔ شیفت‌ها و ساعت‌ها در گزارش‌ها و پروفایل باقی می‌مانند.':'همکاری پایان داده شود؟ فقط وقتی همهٔ شیفت‌ها تسویه شده باشد انجام می‌شود.'))return;
 const r=await sb.rpc('end_cooperation',{p_membership:id,p_force:force});if(r.error)return fail(r.error);await loadMs();home();msg(pers&&!force?'داروخانه بایگانی شد':'همکاری پایان یافت')}
async function shareH(){const r=await sb.rpc('share_history',{p_pharmacy:S.cur,p_from:rd('h_d').g});if(r.error)return fail(r.error);await loadShifts();home();msg('تاریخچه برای موسس نمایش داده می‌شود')}
const admCard=()=>`<div class="card np"><h2>ابزار ادمین</h2><button onclick="admLoad()">نمایش همهٔ داروخانه‌ها و همکاری‌ها</button><div id="adm" class="tw"></div></div>`;
async function admLoad(){const r=await sb.rpc('admin_overview');if(r.error)return fail(r.error);
 $('#adm').innerHTML=r.data.map(p=>`<h3 style="margin:12px 0 4px">${esc(p.name)} <span class="mu" style="font-weight:400">— موسس: ${esc(p.owner||'ندارد')}</span></h3><table>${p.members.map(m=>`<tr><td>${esc(m.name)}</td><td>${m.role=='owner'?'موسس':'داروساز'}</td><td>${m.ended?'پایان‌یافته':'فعال'}</td><td>${m.role=='pharmacist'&&!m.ended?`<button class="d" onclick="admEnd('${m.id}')">پایان اجباری</button>`:''}</td></tr>`).join('')}</table>`).join('')||'<p class="mu">داروخانه‌ای نیست.</p>'}
async function admEnd(id){if(!confirm('همکاری بدون بررسی تسویه پایان داده شود؟'))return;
 const r=await sb.rpc('end_cooperation',{p_membership:id,p_force:true});if(r.error)return fail(r.error);await loadMs();home();msg('همکاری پایان یافت');admLoad()}

// ---------- شروع ----------
sb.auth.onAuthStateChange((ev,ses)=>{
 if(ev=='PASSWORD_RECOVERY'||(REC&&ses&&ses.user)){REC=true;setTimeout(recView,0)}
 else if(ses&&ses.user){if(!S.me||S.me.id!==ses.user.id)setTimeout(()=>boot(ses.user),0)}
 else{S={me:null,ms:[],cur:null,shifts:[],pay:[],bal:{},sub:[],ent:[],tab:'login'};authView()}});

// ---------- بازخورد فوری برای همهٔ دکمه‌ها: «صبر کنید…» تا پایان کار ----------
document.addEventListener('click',e=>{
 const b=e.target.closest&&e.target.closest('button[onclick]');
 if(!b||b.dataset.nobusy)return;
 const code=b.getAttribute('onclick');
 if(/\bthis\b|\bevent\b/.test(code))return;
 e.stopPropagation();e.preventDefault();
 if(b.disabled||b.classList.contains('busy'))return;
 let r;
 try{r=(0,eval)(code)}catch(err){console.error(err);return}
 if(r&&typeof r.then==='function'){
  const html=b.innerHTML;b.disabled=true;b.classList.add('busy');b.textContent='صبر کنید…';
  const done=()=>{if(b.isConnected){b.disabled=false;b.classList.remove('busy');b.innerHTML=html}};
  r.then(done,err=>{console.error(err);done()});
 }
},true);
</script>
