:root{color-scheme:light dark}

.b{white-space:nowrap}
:root{--bg:#f2f5f4;--cd:#fff;--tx:#18262b;--mu:#667a80;--pr:#0b6e66;--bd:#dde5e4;--ok:#157a3b;--wa:#a8590a;--er:#b3261e}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101a1c;--cd:#172629;--tx:#e6eeee;--mu:#93a8ac;--pr:#2bb5a8;--bd:#2a3d41;--ok:#4cc27a;--wa:#e0933f;--er:#f27c74}}
:root[data-theme=dark]{--bg:#101a1c;--cd:#172629;--tx:#e6eeee;--mu:#93a8ac;--pr:#2bb5a8;--bd:#2a3d41;--ok:#4cc27a;--wa:#e0933f;--er:#f27c74}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.7 Vazirmatn,Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:960px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select,button{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;max-width:100%}
button{cursor:pointer;font-weight:600}button.p{background:var(--pr);border-color:var(--pr);color:#fff}button.d{color:var(--er)}
input:focus,select:focus{outline:2px solid var(--pr);outline-offset:1px}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fm label{display:flex;flex-direction:column;gap:3px;color:var(--mu)}
.fb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dt{display:flex;gap:4px}.dt select{flex:1;padding:8px 4px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:right}th{color:var(--mu);font-weight:600}
.b{padding:1px 10px;border-radius:99px;font-size:12px;border:1px solid;font-weight:600}
.fb[hidden]{display:none}.mo{padding:3px 14px;font-weight:800;letter-spacing:2px}.phn{display:none}.b.arch{color:var(--mu)}.bs{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}.un{display:block;font-size:11px;color:var(--mu);font-weight:400}.tg{box-shadow:inset 0 0 0 1px var(--bd)}.b.pending{color:var(--wa)}.b.confirmed{color:var(--ok)}.b.rejected,.b.voided{color:var(--er)}
.mu{color:var(--mu)}.pv{background:var(--bg);border-radius:8px;padding:8px 12px;margin:10px 0}
#msg{position:sticky;top:0;z-index:5}#msg div{padding:9px 12px;border-radius:8px;margin-bottom:10px;border:1px solid var(--ok);background:var(--cd);color:var(--ok)}
#msg div.e{border-color:var(--er);color:var(--er)}
.auth{max-width:420px;margin:6vh auto}.tabs{display:flex;gap:2px;margin-bottom:12px;background:var(--tr);border-radius:99px;padding:4px}.tabs button{flex:1;background:none;border:0;border-radius:99px;box-shadow:none;color:var(--mu);padding:7px 10px}.tabs button.on{color:var(--tx);font-weight:800}
.pw{display:flex;gap:6px}.pw input{flex:1;min-width:0}.pw button{padding:6px 10px}a{color:var(--pr)}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4;margin:10mm}html,body{height:auto!important;overflow:visible!important;background:#fff}.w,#msg,.np{display:none!important}#pa{position:static;overflow:visible;background:#fff;padding:0}.sheet{box-shadow:none;border-radius:0;margin:0;max-width:none;page-break-after:always}.sheet:last-child{page-break-after:auto}tr{page-break-inside:avoid}}
#pa{position:fixed;inset:0;overflow:auto;background:#dfe7e6;z-index:20;padding:env(safe-area-inset-top,0) 10px env(safe-area-inset-bottom,0)}#pa[hidden]{display:none}
.pbar{position:sticky;top:0;display:flex;gap:8px;padding:10px 0;z-index:2}
.sheet{max-width:794px;margin:0 auto 16px;background:#fff;color:#18262b;border-radius:14px;overflow:hidden;box-shadow:0 4px 20px #0002;font-size:13px;line-height:1.7}
.sheet table{white-space:normal;border-collapse:collapse;width:100%}
.sheet th,.sheet td{padding:7px 8px;border-bottom:1px solid #dde8e6;text-align:center;color:#18262b}
.sheet th{background:#e3f2ef;color:#0b6e66;font-weight:800;font-size:12px}
.sheet td.dy{background:#f1f8f6;font-weight:800;color:#0b6e66;border-right:1px solid #cfe3df}
.sh-h{background:linear-gradient(135deg,#0a5d57,#12988a);color:#fff;padding:20px 22px}
.sh-k{font-size:12px;opacity:.85}.sh-n{font-size:22px;font-weight:800;margin:2px 0 14px}
.sh-m{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sh-m div{background:#ffffff26;border-radius:10px;padding:8px 12px}.sh-m span{display:block;font-size:11px;opacity:.85}.sh-m b{font-size:13px}
.sh-b{padding:18px 22px}
.sh-s{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.sh-s div{flex:1;min-width:120px;border:1px solid #cfe3df;border-radius:10px;padding:10px 14px;background:#f6fbfa}.sh-s div.am{background:#fff7e6;border-color:#e8c777}
.sh-s span{display:block;font-size:11px;color:#667a80}.sh-s b{font-size:17px;color:#0b6e66}.sh-s div.am b{color:#8a5a00}
.sh-x{margin-top:14px}.sh-x b{display:block;margin-bottom:4px;color:#0b6e66}
.sh-g{display:flex;gap:24px;margin-top:34px}.sh-g div{flex:1;border-top:1.5px solid #9fb5b2;padding-top:6px;text-align:center;color:#667a80;font-size:12px;min-height:64px}
.sh-f{text-align:center;color:#8aa0a3;font-size:11px;padding:0 0 14px}
.am{width:130px}td .fb{flex-wrap:nowrap}
.code{font:700 18px/1.4 monospace;letter-spacing:2px;direction:ltr;display:inline-block;padding:4px 10px;border:1px dashed var(--pr);border-radius:8px}
/* ---- ظاهر محصول‌گونه + منوی پایین ---- */
body{padding-bottom:0}
.w{padding:16px 14px calc(92px + env(safe-area-inset-bottom,0))}
.card{border:0;border-radius:16px;box-shadow:0 1px 2px #0b2a2d0d,0 4px 14px #0b2a2d0f;padding:16px}

:root[data-theme=dark] .card,:root[data-theme=dark] .kp{box-shadow:none;border:1px solid var(--bd)}
h2{font-size:15px;font-weight:800}
button{border-radius:10px;padding:9px 14px}button.p{box-shadow:0 2px 6px #0b6e6640}
th{font-size:12px}
.top{margin-bottom:10px}.who b{font-size:17px;display:block;line-height:1.4}
.gh{background:transparent;color:var(--mu);border-color:transparent}
.ph-sel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.ph-sel select{flex:1;min-width:190px;font-weight:700}
.upd{font-size:11px;cursor:pointer}
.kps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kp{background:var(--cd);border-radius:16px;padding:14px;box-shadow:0 1px 2px #0b2a2d0d,0 4px 14px #0b2a2d0f;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.kp span{color:var(--mu);font-size:12px}.kp b{font-size:21px;color:var(--pr);line-height:1.5}.kp small{color:var(--mu);font-size:11px}.kp.warn b{color:var(--wa)}
.nav{position:fixed;inset:auto 0 0 0;z-index:10;background:var(--cd);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0));display:flex;justify-content:center;gap:2px}
.nav button{flex:1;max-width:150px;border:0;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600;position:relative;border-radius:12px}
.nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.bdg{display:inline-block;min-width:17px;height:17px;border-radius:9px;background:var(--er);color:#fff;font:700 10px/17px Vazirmatn,Tahoma,sans-serif;text-align:center;padding:0 4px;margin-inline-start:6px;vertical-align:1px}
.nav i{position:absolute;top:1px;left:calc(50% + 3px);min-width:17px;height:17px;border-radius:9px;background:var(--er);color:#fff;font:700 10px/17px Vazirmatn,Tahoma,sans-serif;text-align:center;font-style:normal;padding:0 4px}
.nav button{font-size:10.5px;line-height:1.3;text-align:center}
.rf{padding:7px 12px;font-size:13px;color:var(--pr);border-color:var(--pr);background:transparent}
.ch{display:flex;gap:6px;align-items:flex-end;height:176px;padding-top:18px;margin-top:6px}
.cm{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;min-width:0}
.cb{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;border-bottom:1px solid var(--bd)}

 ind.style.opacity=1;ind.style.top=b.offsetTop+'px';ind.style.height=b.offsetHeight+'px';ind.style.borderRadius='99px';
 if(!ind._set){ind.style.transition='none';ind.style.width=(_navPrev?_navPrev.w:w)+'px';ind.style.transform=`translateX(${_navPrev?_navPrev.l:b.offsetLeft}px)`;void ind.offsetWidth;ind.style.transition=''}

(function(){const ro=new ResizeObserver(es=>es.forEach(e=>{const t=e.target,k=t.offsetWidth+'x'+t.offsetHeight;if(t._k===k)return;t._k=k;if(t.classList.contains('seg'))segPlace(t,true);else if(t.classList.contains('nav'))navPlace(t,true)}));

'کرمانشاه':'کرمانشاه،اسلام‌آباد غرب،سنقر،هرسین،کنگاور،صحنه،جوانرود،پاوه،قصر شیرین،سرپل ذهاب،گیلانغرب،روانسر،ثلاث باباجانی،دالاهو',
'کهگیلویه و بویراحمد':'یاسوج،دهدشت،گچساران،دوگنبدان،سی‌سخت،لنده،چرام،لیکک',
'گلستان':'گرگان،گنبد کاووس،علی‌آباد کتول،آق‌قلا،بندر ترکمن،آزادشهر،کردکوی،مینودشت،رامیان،گالیکش،کلاله،بندر گز،مراوه‌تپه،گمیشان',
'گیلان':'رشت،بندر انزلی،لاهیجان،لنگرود،آستارا،تالش،رودسر،آستانه اشرفیه،صومعه‌سرا،فومن،رودبار،ماسال،سیاهکل،شفت،املش،رضوانشهر',
'لرستان':'خرم‌آباد،بروجرد،دورود،الیگودرز،ازنا،کوهدشت،نورآباد،الشتر،پلدختر،سپیددشت،چگنی،رومشکان',
'مازندران':'ساری،بابل،آمل،قائم‌شهر،بابلسر،تنکابن،نوشهر،چالوس،بهشهر،نکا،محمودآباد،رامسر،فریدون‌کنار،جویبار،گلوگاه،سوادکوه،عباس‌آباد،کلاردشت،نور،سرخرود،میاندورود',
'مرکزی':'اراک،ساوه،خمین،محلات،دلیجان،شازند،آشتیان،تفرش،زرندیه،کمیجان،خنداب،فراهان',
'هرمزگان':'بندرعباس،میناب،بندر لنگه،قشم،رودان،حاجی‌آباد،جاسک،پارسیان،بستک،کیش،بندر خمیر،سیریک،ابوموسی،بشاگرد',
'همدان':'همدان،ملایر،نهاوند،تویسرکان،اسدآباد،کبودرآهنگ،رزن،بهار،فامنین،دمق،لالجین',
'یزد':'یزد،میبد،اردکان،ابرکوه،مهریز،بافق،اشکذر،تفت،مروست،هرات،خاتم،بهاباد،زارچ'
}).map(([k,v])=>[k,[...new Set(v.split('،'))]]));

function locRows(p,o){o=o||{};const h=(i,v)=>`<input type="hidden" id="${p}_${i}" value="${esc(v==null?'':v)}">`;
 return h('pr',o.province)+h('c',o.city)+h('la',o.lat)+h('ln',o.lng)+
 `<div class="srow tap" onclick="pickProv('${p}')"><span class="k">استان</span><b class="v" id="${p}_pv" style="direction:rtl">${esc(o.province||'انتخاب')}</b></div>
 <div class="srow tap" onclick="pickCity('${p}')"><span class="k">شهر</span><b class="v" id="${p}_cv" style="direction:rtl">${esc(o.city||'انتخاب')}</b></div>
 <div class="srow"><span class="k">آدرس</span><input id="${p}_a" value="${esc(o.address||'')}"></div>
 <div class="srow"><span class="k">تلفن</span><input id="${p}_t" type="tel" inputmode="numeric" dir="ltr" value="${esc(o.phone||'')}"></div>
 <div class="srow tap" onclick="pickMap('${p}')"><span class="k">موقعیت روی نقشه</span><b class="v" id="${p}_mv" style="direction:rtl">${o.lat!=null&&o.lng!=null?'ثبت شد ✓':'انتخاب'}</b></div>`}
function locVals(p){const g=k=>($('#'+p+'_'+k).value||'').trim(),t=fa(g('t')).replace(/[\s-]/g,'');
 if(t&&!/^0\d{9,10}$/.test(t)){msg('شماره تلفن معتبر نیست (مثلاً ۰۲۱۲۲۳۳۴۴۵۵)',1);return null}
 return{p_province:g('pr'),p_city:g('c'),p_address:g('a'),p_lat:g('la')===''?null:+g('la'),p_lng:g('ln')===''?null:+g('ln'),p_phone:t}}
function srchSheet(title,items,cb,custom){
 const nz=x=>fa(String(x)).replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u200c\s]/g,'').toLowerCase();
 openSheet(title,`<div class="gc"><div class="srow"><span class="k">جستجو</span><input id="sq" autocomplete="off"></div></div><div class="gc" id="sl" style="padding:0 16px"></div>`,2);
 const draw=()=>{const raw=$('#sq').value.trim(),q=nz(raw),f=items.filter(x=>!q||nz(x).includes(q));
  $('#sl').innerHTML=f.map(x=>`<div class="srow tap" data-v="${esc(x)}"><b class="v" style="direction:rtl;font-weight:500">${esc(x)}</b></div>`).join('')+(custom&&q&&!items.some(x=>nz(x)==q)?`<div class="srow tap" data-v="${esc(raw.slice(0,60))}"><b class="v" style="direction:rtl;color:var(--pr)">افزودن «${esc(raw.slice(0,60))}»</b></div>`:'')||'<p class="mu" style="padding:14px 0;margin:0">موردی پیدا نشد</p>'};
 draw();$('#sq').oninput=draw;
 $('#sl').onclick=e=>{const r=e.target.closest('.srow[data-v]');if(!r)return;closeSheet(2);cb(r.dataset.v)};
 setTimeout(()=>$('#sq')&&$('#sq').focus(),380)}
function pickProv(p){srchSheet('انتخاب استان',Object.keys(IRC),v=>{if($('#'+p+'_pr').value!=v){$('#'+p+'_pr').value=v;$('#'+p+'_c').value='';$('#'+p+'_cv').textContent='انتخاب'}$('#'+p+'_pv').textContent=v})}
function pickCity(p){const pr=$('#'+p+'_pr').value;if(!pr)return msg('اول استان را انتخاب کنید',1);
 srchSheet('انتخاب شهر',IRC[pr]||[],v=>{$('#'+p+'_c').value=v;$('#'+p+'_cv').textContent=v},1)}
const NKEY='web.c66a9c0f610b4d1cbf098a6d378175c8';let NSH=false;
const loadJs=u=>new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=u;sc.onload=ok;sc.onerror=()=>no(new Error('load'));document.head.appendChild(sc)}),
 loadCss=u=>{const l=document.createElement('link');l.rel='stylesheet';l.href=u;document.head.appendChild(l)};
async function loadLeaflet(){if(window.L&&window.L.map)return;
 try{loadCss('https://static.neshan.org/sdk/leaflet/1.4.0/leaflet.css');await loadJs('https://static.neshan.org/sdk/leaflet/1.4.0/leaflet.js');NSH=true}
 catch(e){loadCss('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css');
  try{await loadJs('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js')}catch(e2){throw new Error('نقشه بارگذاری نشد؛ اینترنت را بررسی کنید')}}}
let MP={};
async function mapGo(q,z){try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=fa&countrycodes=ir&q='+encodeURIComponent(q)),d=await r.json();
 if(!d.length)return false;if(MP.map)MP.map.setView([+d[0].lat,+d[0].lon],z);return true}catch(e){return false}}
async function mapFind(){const q=($('#mq').value||'').trim();if(!q)return;const ok=await mapGo([q,MP.c,MP.pr].filter(Boolean).join('، '),16);if(!ok)msg('جایی پیدا نشد؛ عبارت دیگری را امتحان کنید',1)}
function mapMe(){if(!navigator.geolocation)return msg('مرورگر موقعیت‌یابی ندارد',1);
 navigator.geolocation.getCurrentPosition(q=>{if(MP.map)MP.map.setView([q.coords.latitude,q.coords.longitude],17)},()=>msg('دسترسی به موقعیت داده نشد',1),{enableHighAccuracy:true,timeout:10000})}
async function pickMap(p){try{await loadLeaflet()}catch(e){return fail(e)}
 const la=parseFloat($('#'+p+'_la').value),ln=parseFloat($('#'+p+'_ln').value),has=isFinite(la)&&isFinite(ln),pr=$('#'+p+'_pr').value,c=$('#'+p+'_c').value;
 openSheet('انتخاب موقعیت',`<div style="position:relative;border-radius:20px;overflow:hidden;margin-bottom:12px"><div id="mp" dir="ltr" style="height:52vh;background:var(--cd)"></div><div class="mpin"></div>
 <div class="mps"><input id="mq" placeholder="جستجوی محله یا خیابان" onkeydown="if(event.key=='Enter')mapFind()"><button onclick="mapFind()">جستجو</button></div>
 <button class="mloc" onclick="mapMe()">موقعیت من</button></div>
 <p class="mu" style="margin:0 6px 10px;font-size:13px;text-align:center">نقشه را حرکت بدهید تا سنجاق روی محل داروخانه قرار بگیرد.</p>
 <button class="p wide" id="mok">تأیید موقعیت</button>`,2);
 setTimeout(()=>{if(!$('#mp'))return;const ctr=has?[la,ln]:[32.4,53.7],zm=has?17:5,
   m=NSH?new L.Map('mp',{key:NKEY,maptype:isDark()?'standard-night':'standard-day',poi:true,traffic:false,zoomControl:false,center:ctr,zoom:zm}):L.map('mp',{zoomControl:false}).setView(ctr,zm);
  if(!NSH)L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,attribution:'© OpenStreetMap © CARTO'}).addTo(m);
  L.control.zoom({position:'bottomright'}).addTo(m);
  MP={map:m,pr,c};m.invalidateSize();
  if(!has&&(c||pr))mapGo([c,pr].filter(Boolean).join('، '),c?12:8);
  $('#mok').onclick=()=>{const k=m.getCenter();$('#'+p+'_la').value=k.lat.toFixed(6);$('#'+p+'_ln').value=k.lng.toFixed(6);const b=$('#'+p+'_mv');if(b)b.textContent='ثبت شد ✓';closeSheet(2)}},420)}
function shareTxt(pid,sid){const x=S.ms.find(m=>m.pharmacy_id==pid),p=x&&x.pharmacies;if(!p)return;
 const lv=!!($('#ep_a')&&$('#ep_n')),v=(k,f)=>lv?($('#ep_'+k).value||'').trim():(p[f]==null?'':String(p[f])),T=['داروخانه '+(lv?$('#ep_n').value.trim():p.name)],
 pr=v('pr','province'),c=v('c','city'),a=v('a','address'),t=v('t','phone'),la=v('la','lat'),ln=v('ln','lng'),s=sid&&S.shifts.find(y=>y.id==sid),ad=[pr,c==pr?'':c,a].filter(Boolean).join('، ');
 if(ad)T.push('آدرس: '+ad);if(t)T.push('تلفن: '+t);if(la&&ln)T.push('موقعیت روی نقشه: https://www.google.com/maps?q='+la+','+ln);
 if(s)T.push('','شیفت: '+jd(s.shift_date)+' · ساعت '+s.start_time+' تا '+s.end_time);
 if(T.length<2)return msg('آدرس این داروخانه هنوز ثبت نشده؛ از «داروخانه‌های من» ثبتش کنید',1);
 const txt=T.join('\n'),cp=()=>{const z=document.createElement('textarea');z.value=txt;document.body.appendChild(z);z.select();try{document.execCommand('copy');msg('متن کپی شد ✓')}catch(e){msg('کپی نشد',1)}z.remove()};
 if(navigator.share)navigator.share({text:txt}).catch(e=>{if(e&&e.name!='AbortError')cp()});else cp()}
document.addEventListener('keydown',e=>{if(e.key!='Escape')return;for(const l of [3,2,1]){if($('#sh'+l)){closeSheet(l);return}}if($('#pa')&&!$('#pa').hidden)closePrint()});
function askWhy(title,ok,cb){openSheet(title,`<div class="gc"><div class="srow"><span class="k">دلیل</span><input id="why" placeholder="دلیل را بنویسید"></div></div><button class="p wide" id="why_ok">${ok}</button>`,3);setTimeout(()=>{const x=$('#why');x&&x.focus()},380);$('#why_ok').onclick=()=>{const v=$('#why').value.trim();if(!v)return msg('دلیل را بنویسید',1);closeSheet(3);cb(v)}}
function askYes(title,text,ok,cb){openSheet(title,`<p class="mu" style="margin:0 6px 14px;line-height:1.9">${text}</p><button class="p wide" id="yn_ok">${ok}</button>`,3);$('#yn_ok').onclick=()=>{closeSheet(3);cb()}}
</script>
